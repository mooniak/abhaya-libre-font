name: Build font and proofs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master # for backwards compatibility; use your default branch if different
      - dev
    tags:
      - "*"

permissions: write-all

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Guard - release tags must be on main
        # Day-to-day work happens on `dev`; `main` only moves when a release is cut. A plain
        # vX.YYY tag (no -dev suffix) publishes a `release`, so it must point at a commit that is
        # already on `main` (merge dev -> main, then tag main). Fails fast, before the build.
        # compare API: status is head (this commit) relative to base (main) - "identical"/"behind"
        # mean the commit is reachable from main; "ahead"/"diverged" mean it is not.
        if: ${{ github.ref_type == 'tag' && !endsWith(github.ref_name, '-dev') && !contains(github.ref_name, '-dev.') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$STATUS" in
            identical|behind) echo "ok: release tag ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) is on main" ;;
            *)
              echo "::error::Release tag ${GITHUB_REF_NAME} is not on main (compare status: ${STATUS}). Merge dev into main first (merge commit or fast-forward, no squash), then tag main. For a development preview use vX.YYY-dev.N."
              exit 1 ;;
          esac
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"
      - name: Setup fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cargo-bins/cargo-binstall@main
        name: Install cargo binstall
      - name: Install Rust font tools
        run: |
          cargo binstall --no-confirm --disable-strategies compile diffenator3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install toolset
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
          # yq (mikefarah) is preinstalled on GitHub-hosted ubuntu runners; snap is flaky, so avoid it
      - uses: actions/cache@v5
        with:
          path: ./venv/
          key: ${{ runner.os }}-venv${{ steps.python.outputs.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv${{ steps.python.outputs.python-version }}-
      - name: Set artifact file name
        id: zip-name
        shell: bash
        # Set the archive name to repo name + "-fonts" e.g "radiocanadafonts-fonts.zip"
        run: echo "ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-fonts" >> $GITHUB_ENV
      - name: Read distribution tier
        id: tier
        shell: bash
        # "free" | "premium" from fontpackage.json; anything else counts as premium (fail closed).
        # Premium fonts never deploy to GitHub Pages, even from a public repo.
        run: |
          T=$(python3 -c "import json;print(json.load(open('fontpackage.json')).get('tier') or 'premium')" 2>/dev/null || echo premium)
          echo "TIER=$T" >> $GITHUB_ENV
          echo "tier=$T" >> $GITHUB_OUTPUT

      # If a new release is cut, use the release tag to auto-bump the source files
      # - name: Bump release
      #   if: github.event_name == 'release'
      #   run: |
      #     . venv/bin/activate
      #     SRCS=$(yq e ".sources[]" sources/config.yaml)
      #     TAG_NAME=${GITHUB_REF/refs\/tags\//}
      #     echo "Bumping $SRCS to $TAG_NAME"
      #     for src in $SRCS
      #     do
      #       bumpfontversion sources/$src --new-version $TAG_NAME;
      #     done

      - name: Build font
        run: make build
      - name: Stamp version (OpenFV name table)
        run: make stamp
      - name: Check with fontspector
        run: make test
        continue-on-error: true
      - name: Generate proofs
        run: make proof
      - name: Emit build manifest (fontstatus.json)
        run: make manifest
      - name: Install PDF renderer (dev / release builds only)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          . venv/bin/activate
          pip install playwright
          playwright install --with-deps chromium
      - name: Build stage-gated proof site
        # Which proof sections appear is decided by the font's computed design stage (scripts/gates.json);
        # how deep the proof goes by the channel: canary = HTML, dev/release also PDF books.
        run: make pages PDF=${{ github.ref_type == 'tag' && '1' || '' }}
      - name: Archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            fonts
            out
      - name: Set short SHA
        if: ${{ github.ref_name == 'dev' && github.event_name == 'push' }}
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Archive dev-channel fonts for FontPipe
        if: ${{ github.ref_name == 'dev' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v6
        with:
          name: dev-fonts-${{ env.SHORT_SHA }}
          path: fonts/**/*.ttf
          retention-days: 30
      - name: Publish channel (canary / dev / release)
        # canary = push to dev; dev = a *-dev.N tag; release = any other tag (guarded: must be on main).
        if: ${{ (github.ref_name == 'dev' && github.event_name == 'push') || github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in *-dev.*|*-dev) CH=dev ;; *) CH=release ;; esac
          else CH=canary; fi
          bash scripts/publish_channel.sh "$CH"
      - name: Publish proof site to GitHub Pages (latest dev build + canary log)
        # Public + free-tier repos only (premium / undeclared tier fails closed: nothing is published).
        # gh-pages root = this build; canary/<sha7>/ keeps it per commit. See scripts/publish_pages.sh.
        if: ${{ github.ref_name == 'dev' && github.event_name == 'push' && github.event.repository.private == false && env.TIER == 'free' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_pages.sh _site

  # Publishing (canary / dev / release) is handled by the "Publish channel" step in the
  # build job (scripts/publish_channel.sh) — the build job already has the built fonts +
  # fontstatus.json in hand, so no separate release job / artifact round-trip is needed.
  # canary → rolling `canary` pre-release; dev → `vX.YYY-dev.N` pre-release; release →
  # `vX.YYY` Release. See docs/channels-and-versioning.md + docs/fontpipe-migration-brief.md.
