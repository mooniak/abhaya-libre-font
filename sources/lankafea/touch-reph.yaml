# Abhaya Libre: the repaya on a touching cluster (ර්‍ක‍්ක), merged into lankafea's
# generated features with --inject. Written from the tables in Abhaya's old touch_reph and
# touch_reph_matraI lookups, which never ran under HarfBuzz; this is what they meant to do.
#
# lankafea forms the repaya on the second consonant: C1 touch C2_repha. Then:
#  - when the second consonant takes ි or ී, the repaya moves over the first consonant;
#    its variant depends on the first consonant's height (TouchRephSign + TouchRephVowel).
#  - otherwise the repaya sits over the join; its variant depends on the second
#    consonant (TouchRephJoin).
# Positional variants move to GPOS later: abhaya-libre-font#106.
classes:
  TouchFirstAscending: [kha, nga, nnga, ca, jha, tta, ttha, dda, ddha, nndda, tha, dha, pha, ba, ma, mba, va]
  TouchFirstBodyHeight: [ka, ga, gha, cha, ja, nya, jnya, nyja, nna, ta, na, pa, bha, ya, la, sha, ssa, sa, ha, lla, fa]
  TouchFirstNarrow: [da, nda]
  TouchRephTakesI: [bBa_repha, ba_repha, bha_repha, cCa_repha, ca_repha, cha_repha, dDha_repha, dVa_repha, da_repha, dda_repha, ddha_repha, dha_repha, fa_repha, fpa_repha, gDha_repha, ga_repha, gha_repha, ha_repha, ja_repha, jha_repha, jnya_repha, kSsa_repha, kVa_repha, ka_repha, kha_repha, la_repha, lla_repha, ma_repha, mba_repha, nDa_repha, nDha_repha, nTha_repha, nVa_repha, na_repha, nda_repha, nga_repha, nna_repha, nndda_repha, nnga_repha, nyCa_repha, nyCha_repha, nya_repha, nyja_repha, pa_repha, pha_repha, ra_repha, sa_repha, sha_repha, ssa_repha, tTha_repha, tVa_repha, ta_repha, tha_repha, ttTtha_repha, tta_repha, ttha_repha, va_repha, ya_repha]
  TouchRephTakesIi: [bBa_repha, ba_repha, bha_repha, cCa_repha, ca_repha, cha_repha, dDha_repha, dVa_repha, da_repha, dda_repha, ddha_repha, dha_repha, fa_repha, fpa_repha, gDha_repha, ga_repha, gha_repha, ha_repha, ja_repha, jha_repha, jnya_repha, kSsa_repha, kVa_repha, ka_repha, kha_repha, la_repha, lla_repha, ma_repha, mba_repha, nDa_repha, nDha_repha, nTha_repha, nVa_repha, na_repha, nda_repha, nga_repha, nna_repha, nndda_repha, nnga_repha, nyCa_repha, nyCha_repha, nya_repha, nyja_repha, pa_repha, pha_repha, ra_repha, sa_repha, sha_repha, ssa_repha, tTha_repha, tVa_repha, ta_repha, tha_repha, ttTtha_repha, tta_repha, ttha_repha, va_repha, ya_repha]
lookups:
  - name: TouchRephSign
    feature: psts
    comment: touching cluster + ි/ී - the repaya goes after the sign, over the first consonant
    rules:
      - {sub: ['@TouchFirstAscending', touch, '@TouchRephTakesI', "isign'"], by: [isign, repha-sinh.003]}
      - {sub: ['@TouchFirstAscending', touch, '@TouchRephTakesIi', "iisign'"], by: [iisign, repha-sinh.003]}
      - {sub: ['@TouchFirstBodyHeight', touch, '@TouchRephTakesI', "isign'"], by: [isign, repha-sinh.004]}
      - {sub: ['@TouchFirstBodyHeight', touch, '@TouchRephTakesIi', "iisign'"], by: [iisign, repha-sinh.004]}
      - {sub: ['@TouchFirstNarrow', touch, '@TouchRephTakesI', "isign'"], by: [isign, repha-sinh.005]}
      - {sub: ['@TouchFirstNarrow', touch, '@TouchRephTakesIi', "iisign'"], by: [iisign, repha-sinh.005]}
