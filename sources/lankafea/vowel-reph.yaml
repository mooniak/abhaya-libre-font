# Abhaya Libre: the repaya on a consonant that takes ි or ී (ර්‍කි, ර්‍ථී), merged into
# lankafea's generated features with --inject. Written from the tables in Abhaya's old
# matraI_matraII_reph lookup, which never ran under HarfBuzz (the repaya ligates onto the
# consonant before the vowel sign does, so `kI repha` never occurs); this is what it meant
# to do: the vowel ligature, with the repaya inside the ි/ී loop.
#
#   C_repha + ි  ->  CI + repha-sinh.006   (most consonants)
#                    CI + repha-sinh.007   (ථ ඨ ඪ ඵ and their conjuncts: a wider loop)
#                    CI + repha-sinh.008   (ණ)
#
# Runs after touch-reph.yaml (inject files merge in name order), which has already
# handled the touching clusters, so no C_repha of a touching cluster is left here.
# Positional variants move to GPOS later: abhaya-libre-font#106.
classes:
  RephTakesI006: [ka_repha, kha_repha, ga_repha, gha_repha, nga_repha, nnga_repha, ca_repha, cha_repha, ja_repha, jha_repha, nya_repha, jnya_repha, nyja_repha, tta_repha, dda_repha, nndda_repha, ta_repha, da_repha, dha_repha, na_repha, nda_repha, pa_repha, ba_repha, bha_repha, ma_repha, mba_repha, ya_repha, ra_repha, la_repha, va_repha, sha_repha, ssa_repha, sa_repha, ha_repha, lla_repha, fa_repha, fpa_repha, kSsa_repha, kVa_repha, tVa_repha, nDa_repha, nDha_repha, nVa_repha, gDha_repha, dVa_repha, dDha_repha, ttTtha_repha, nyCa_repha, nyCha_repha, cCa_repha, bBa_repha]
  RephTakesIi006: [ka_repha, kha_repha, ga_repha, gha_repha, nga_repha, nnga_repha, ca_repha, cha_repha, ja_repha, jha_repha, nya_repha, jnya_repha, nyja_repha, tta_repha, dda_repha, nna_repha, nndda_repha, ta_repha, da_repha, dha_repha, na_repha, nda_repha, pa_repha, ba_repha, bha_repha, ma_repha, mba_repha, ya_repha, ra_repha, la_repha, va_repha, sha_repha, ssa_repha, sa_repha, ha_repha, lla_repha, fa_repha, fpa_repha, kSsa_repha, kVa_repha, tVa_repha, nDa_repha, nDha_repha, nVa_repha, gDha_repha, dVa_repha, dDha_repha, nyCa_repha, nyCha_repha, cCa_repha, bBa_repha]
  RephTakesI007: [ttha_repha, ddha_repha, tha_repha, pha_repha, tTha_repha, nTha_repha]
  RephTakesIi007: [ttha_repha, ddha_repha, tha_repha, pha_repha, tTha_repha, nTha_repha]
  RephTakesI008: [nna_repha]
  RephTakesIi008: [nna_repha]
  RephInLoop: [repha-sinh.006, repha-sinh.007, repha-sinh.008]
lookups:
  - name: VowelRephSign
    feature: psts
    comment: repaya + ි/ී - the repaya variant goes after the sign
    rules:
      - {sub: ['@RephTakesI006', "isign'"], by: [isign, repha-sinh.006]}
      - {sub: ['@RephTakesIi006', "iisign'"], by: [iisign, repha-sinh.006]}
      - {sub: ['@RephTakesI007', "isign'"], by: [isign, repha-sinh.007]}
      - {sub: ['@RephTakesIi007', "iisign'"], by: [iisign, repha-sinh.007]}
      - {sub: ['@RephTakesI008', "isign'"], by: [isign, repha-sinh.008]}
      - {sub: ['@RephTakesIi008', "iisign'"], by: [iisign, repha-sinh.008]}
  - name: VowelRephVowel
    feature: psts
    comment: repaya + ි/ී - the consonant takes the sign
    rules:
      - {sub: ["ka_repha'", "isign'", '@RephInLoop'], by: kI}
      - {sub: ["kha_repha'", "isign'", '@RephInLoop'], by: khI}
      - {sub: ["ga_repha'", "isign'", '@RephInLoop'], by: gI}
      - {sub: ["gha_repha'", "isign'", '@RephInLoop'], by: ghI}
      - {sub: ["nga_repha'", "isign'", '@RephInLoop'], by: ngI}
